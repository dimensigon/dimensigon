# Dimensigon Virtual Host Configuration
# HTTPS server with SSL/TLS termination and reverse proxy to Dimensigon

# HTTP server - Redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name dimensigon.example.com;

    # Let's Encrypt ACME challenge
    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/certbot;
    }

    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS server - Main Dimensigon application
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dimensigon.example.com;

    # SSL certificate configuration
    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    # Uncomment if using Let's Encrypt with Certbot:
    # ssl_certificate /etc/letsencrypt/live/dimensigon.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/dimensigon.example.com/privkey.pem;

    # SSL configuration (inherited from main nginx.conf)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # HSTS (HTTP Strict Transport Security)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Security headers (browser hardening / defense-in-depth, CWE-693)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # Access and error logs
    access_log /var/log/nginx/dimensigon-access.log main;
    error_log /var/log/nginx/dimensigon-error.log warn;

    # Client body size
    client_max_body_size 100M;

    # Rate limiting
    limit_req zone=dimensigon_limit burst=20 nodelay;
    limit_conn addr 10;

    # Root location - Health check endpoint
    location /health {
        proxy_pass http://dimensigon_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # No caching for health checks
        proxy_no_cache 1;
        proxy_cache_bypass 1;

        # Short timeout
        proxy_connect_timeout 5s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;
    }

    # API endpoints
    location /api/ {
        proxy_pass https://dimensigon_backend/api/;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 24 4k;
        proxy_busy_buffers_size 8k;
        proxy_max_temp_file_size 2048m;
        proxy_temp_file_write_size 32k;

        # SSL verification to backend
        proxy_ssl_verify off;

        # No caching for API
        proxy_no_cache 1;
        proxy_cache_bypass 1;

        # Error handling
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
        proxy_next_upstream_tries 2;
    }

    # DM-WebManager Admin GUI
    location /admin/ {
        proxy_pass https://dimensigon_backend/admin/;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # SSL
        proxy_ssl_verify off;
    }

    # Static files (if any)
    location /static/ {
        proxy_pass https://dimensigon_backend/static/;
        proxy_http_version 1.1;

        # Cache static assets
        proxy_cache_valid 200 1h;
        proxy_cache_valid 404 1m;
        expires 1h;
        add_header Cache-Control "public, immutable";

        # Headers
        proxy_set_header Host $host;

        # SSL
        proxy_ssl_verify off;
    }

    # Root location - Proxy to Dimensigon
    location / {
        proxy_pass https://dimensigon_backend/;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 24 4k;

        # SSL
        proxy_ssl_verify off;

        # Error handling
        proxy_intercept_errors on;
        error_page 502 503 504 /50x.html;
    }

    # Error pages
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

